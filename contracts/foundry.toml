[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../deployments" }]
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
xlayer_sentio = "https://xlayer-mainnet.rpc.sentio.xyz"
